<!DOCTYPE html>
<html>
<head>
    <title>My Space</title>
    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .card {
            background: #1f2937;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #38bdf8;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>✨ My Space</h1>
        <p>Welcome to my little corner of the web!</p>

        <button>Explore 🚀</button>
    </div>

</body>
</html>
